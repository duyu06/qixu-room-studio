name: Bootstrap Qixu V4
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  restore:
    if: "!contains(github.event.head_commit.message, 'build: unpack Qixu V4 source')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Restore complete source from transport archive
        run: node scripts/unpack.mjs
      - name: Verify and commit unpacked source
        run: |
          node --check site/src/main.js
          node tests/logic.test.cjs
          node tests/feng-model.test.mjs
          node tests/space-model.test.mjs
          node tests/history-model.test.mjs
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "build: unpack Qixu V4 source"
          git push origin HEAD:main
