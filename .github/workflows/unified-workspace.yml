name: Unified Studio workspace acceptance
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  unified-workspace:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: |
          node tests/studio-analysis.test.mjs
          node tests/studio-model.test.mjs
          node tests/studio-render-bridge.test.mjs
      - run: npm install --no-save --no-audit --no-fund @playwright/test@1.64.0
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test --config=tests/browser/playwright.config.mjs tests/browser/unified-workspace.spec.mjs
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: unified-workspace-errors
          path: |
            test-results/
            playwright-report/
          retention-days: 7
