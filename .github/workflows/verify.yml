name: Verify Qixu V5
on:
  push:
  pull_request:
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check JavaScript syntax
        run: |
          for f in site/src/*.js; do node --check "$f"; done
      - name: Run logic tests
        run: |
          node tests/logic.test.cjs
          node tests/feng-model.test.mjs
          node tests/space-model.test.mjs
          node tests/history-model.test.mjs
          node tests/connected-layout.test.mjs
          node tests/ventilation.test.mjs
          node tests/solar-cfd.test.mjs
          node tests/image-integrity.test.mjs
          node tests/release-gate.test.mjs
          node tests/blueprint-project.test.mjs
          node tests/scale-calibration.test.mjs
          node tests/studio-model.test.mjs
          node tests/qixu-routes.test.mjs
          node tests/showcase-templates.test.mjs
          node tests/studio-geometry.test.mjs
          node tests/studio-dxf.test.mjs
          node tests/studio-render-bridge.test.mjs
          node tests/studio-tour.test.mjs
          node tests/studio-airflow-path.test.mjs
          node tests/studio-flow-model.test.mjs
          node tests/studio-cfd-job.test.mjs
          node tests/studio-cfd-stl.test.mjs
          node tests/studio-alignment.test.mjs
          node tests/studio-groups.test.mjs
          node tests/studio-wall-parameters.test.mjs
          node tests/studio-wall-joints.test.mjs
          node tests/studio-wall-types.test.mjs
          node tests/studio-inference.test.mjs
