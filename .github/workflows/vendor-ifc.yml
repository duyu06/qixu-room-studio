name: Vendor IFC WASM
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - package.json
      - tools/vendor-ifc.mjs
      - .github/workflows/vendor-ifc.yml
permissions:
  contents: write
jobs:
  vendor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Download pinned IFC runtime
        run: npm install --no-save --no-audit --no-fund
      - name: Copy browser runtime
        run: node tools/vendor-ifc.mjs
      - name: Commit self-hosted assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/vendor/ifc
          git diff --cached --quiet || (git commit -m "vendor: pin web-ifc browser WASM runtime" && git push origin HEAD:main)
